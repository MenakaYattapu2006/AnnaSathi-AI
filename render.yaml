services:
  - type: web
    name: annasathi
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://annasathi.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: annasathi-media
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: annasathiai@gmail.com
      - key: BREVO_SENDER_NAME
        value: AnnaSathi AI Security
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_HMAC_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_NIM_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
