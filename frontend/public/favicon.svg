<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="60%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#0F392B"/>
    </linearGradient>
    <linearGradient id="leafLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="50%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#0F392B"/>
    </linearGradient>
  </defs>

  <!-- Golden Sun / Hope Crescent Arc -->
  <path d="M 100 24 A 72 72 0 0 1 156 140 A 68 68 0 0 0 104 34" fill="url(#gold)" />
  <circle cx="152" cy="40" r="8" fill="#F59E0B" />
  <path d="M 152 40 C 160 34 170 36 170 46 C 164 52 152 50 152 40 Z" fill="#D97706" />

  <!-- Outer Protective Leaf (Left Wing) -->
  <path d="M 100 164 C 86 132 60 92 64 48 C 78 72 94 100 100 164 Z" fill="url(#leafDark)" />
  <path d="M 64 48 C 74 84 84 128 98 164 C 80 146 68 100 64 48 Z" fill="url(#leafLight)" opacity="0.9" />

  <!-- Human Figure with Raised Joyful Arms -->
  <!-- Head -->
  <circle cx="98" cy="64" r="9" fill="url(#bodyGrad)" />

  <!-- Upper Body & Uplifted Arms -->
  <path d="M 98 78 C 90 84 82 84 74 70 C 82 76 90 80 94 86 C 90 100 92 120 100 164 C 106 124 104 100 100 86 C 106 82 114 74 124 56 C 116 76 106 82 98 78 Z" fill="url(#bodyGrad)" />
</svg>
